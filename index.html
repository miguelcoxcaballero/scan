<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scanner Pro</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131314">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
:root {
    --md-sys-color-primary: #d97736;
    --md-sys-color-on-primary: #fff;
    --md-sys-color-primary-container: #ffdbca;
    --md-sys-color-on-primary-container: #331200;
    --md-sys-color-secondary-container: #ffeedd;
    --md-sys-color-on-secondary-container: #2e1500;
    --md-sys-color-error: #ba1a1a;
    --surface-1: #fff;
    --surface-2: #fff8f5;
    --surface-3: #fcf6f3;
    --outline: #85736b;
    --outline-variant: #d7c2b9;
    --text-main: #201a17;
    --text-sub: #50453f;
    --grid-color: #e0e0e0;
    --shadow-color: rgba(0,0,0,.08);
    --ease-spring: cubic-bezier(.2,0,0,1);
    --ease-slide: cubic-bezier(.2,.8,.2,1);
    --mobile-sheet-header-height: 160px;
    --safe-bottom: env(safe-area-inset-bottom,0px)
}
body.dark-mode {
    --md-sys-color-primary: #ffb784;
    --md-sys-color-on-primary: #54260e;
    --md-sys-color-primary-container: #753313;
    --md-sys-color-on-primary-container: #ffdbca;
    --md-sys-color-secondary-container: #5c4032;
    --md-sys-color-on-secondary-container: #ffdbca;
    --surface-1: #201a17;
    --surface-2: #201a17;
    --surface-3: #131314;
    --outline: #a08c84;
    --outline-variant: #53433f;
    --text-main: #ede0db;
    --text-sub: #d0c4bf;
    --grid-color: #333;
    --shadow-color: rgba(0,0,0,.6)
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    outline: none;
    -webkit-tap-highlight-color: transparent
}
body {
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    display: flex;
    background: var(--surface-3);
    color: var(--text-main);
    font-family: Roboto, sans-serif;
    overflow: hidden;
    transition: background-color .3s ease
}
.font-logo { font-family: Comfortaa, cursive }
.hidden { display: none !important }
#appLoading {
    position: fixed;
    inset: 0;
    background: var(--surface-3);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity .4s
}
.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--outline);
    border-top-color: var(--md-sys-color-primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px
}
@keyframes spin { to { transform: rotate(360deg) } }
#landingPage {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface-3);
    transition: opacity .5s var(--ease-spring), transform .5s var(--ease-spring);
    padding: 24px;
    padding-bottom: calc(24px + var(--safe-bottom))
}
#landingPage.drag-over {
    outline: 3px dashed var(--md-sys-color-primary);
    outline-offset: -3px;
    background: rgba(217,119,54,0.05)
}
.hero-content {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    animation: heroEnter .8s var(--ease-spring);
    width: 100%;
    max-width: 600px
}
@keyframes heroEnter {
    from { opacity: 0; transform: translateY(30px) }
    to { opacity: 1; transform: translateY(0) }
}
.hero-icon {
    font-size: 64px;
    color: var(--md-sys-color-primary);
    margin-bottom: 8px
}
.hero-title {
    font-family: "Google Sans", sans-serif;
    font-size: 44px;
    font-weight: 400;
    color: var(--text-main)
}
.hero-sub {
    font-size: 16px;
    color: var(--text-sub);
    margin-top: -16px;
    margin-bottom: 16px
}
.hero-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center
}
.btn-hero {
    height: 56px;
    padding: 0 32px;
    border-radius: 28px;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    border: 0;
    font-family: "Google Sans", sans-serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,.1);
    transition: transform .2s, box-shadow .2s;
    white-space: nowrap
}
.btn-hero:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 12px rgba(0,0,0,.15)
}
.btn-hero:active { transform: scale(.98) }
.btn-hero.secondary {
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container)
}
.dropdown {
    position: relative;
    display: inline-block
}
.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 160px;
    background: var(--surface-1);
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,.2);
    z-index: 1000;
    margin-top: 8px;
    padding: 8px 0;
    overflow: hidden;
    transform-origin: top left;
    animation: menuFadeIn .2s ease-out
}
@keyframes menuFadeIn {
    from { opacity: 0; transform: scaleY(.8) }
    to { opacity: 1; transform: scaleY(1) }
}
.dropdown.show .dropdown-content { display: block }
.dropdown-item {
    padding: 12px 24px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-main);
    cursor: pointer;
    font-family: "Google Sans", sans-serif;
    font-size: 14px;
    font-weight: 500;
    transition: background .2s;
    background: transparent;
    border: 0;
    width: 100%;
    text-align: left
}
.dropdown-item:hover { background: var(--surface-2) }
.dropdown-item span {
    font-size: 20px;
    color: var(--md-sys-color-primary)
}
.inhouse-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: .6;
    transition: opacity .2s, color .2s;
    text-decoration: none;
    color: var(--text-sub);
    user-select: none;
    pointer-events: none
}
.inhouse-badge svg {
    width: 28px;
    height: 16px;
    stroke-width: 6;
    stroke: var(--md-sys-color-primary);
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round
}
.inhouse-badge span {
    font-family: Comfortaa, cursive;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: -.5px
}
#landingPage .inhouse-badge {
    position: absolute;
    bottom: calc(32px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%)
}
.sidebar-footer-brand {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--outline-variant);
    display: flex;
    justify-content: center
}
.sidebar-footer-brand .inhouse-badge { opacity: .5 }
#modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 600;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity .3s;
    padding: 16px;
    padding-bottom: calc(16px + var(--safe-bottom))
}
#modalOverlay.open {
    display: flex;
    opacity: 1
}
.modal-card {
    background: var(--surface-1);
    width: 100%;
    max-width: 400px;
    padding: 24px;
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    transform: scale(.9);
    opacity: 0;
    transition: .3s var(--ease-spring);
    display: flex;
    flex-direction: column;
    gap: 24px
}
#modalOverlay.open .modal-card {
    transform: scale(1);
    opacity: 1
}
.modal-title {
    font-family: "Google Sans";
    font-size: 24px;
    color: var(--text-main)
}
.input-group { position: relative }
.mat-input {
    width: 100%;
    height: 56px;
    border: 1px solid var(--outline-variant);
    border-radius: 4px;
    background: transparent;
    padding: 0 16px;
    color: var(--text-main);
    font-size: 16px;
    transition: .2s
}
.mat-input:focus {
    border-color: var(--md-sys-color-primary);
    border-width: 2px;
    padding: 0 15px
}
.input-label {
    position: absolute;
    left: 12px;
    top: -10px;
    background: var(--surface-1);
    padding: 0 4px;
    font-size: 12px;
    color: var(--md-sys-color-primary)
}
.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px
}
.btn-text {
    height: 40px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--md-sys-color-primary);
    font-family: "Google Sans";
    font-weight: 500;
    cursor: pointer;
    border-radius: 20px;
    transition: .2s
}
.btn-text:hover { background: rgba(0,0,0,.05) }
.btn-fill {
    height: 40px;
    padding: 0 24px;
    border: 0;
    border-radius: 20px;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    font-family: "Google Sans";
    font-weight: 500;
    cursor: pointer;
    transition: .2s
}
.btn-fill:hover { filter: brightness(1.1) }
#appContainer {
    flex: 1;
    display: flex;
    padding: 12px;
    gap: 16px;
    width: 100vw;
    height: 100%;
    opacity: 0;
    transform: scale(.98);
    transition: opacity .6s .2s, transform .6s .2s var(--ease-spring)
}
#appContainer.active {
    opacity: 1;
    transform: scale(1)
}
#mainPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--surface-3);
    border-radius: 16px;
    overflow: hidden;
    position: relative
}
#toolbar {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 8px;
    flex-shrink: 0
}
.doc-title {
    background: transparent;
    border: 0;
    color: var(--text-main);
    font-family: "Google Sans", sans-serif;
    font-size: 18px;
    padding: 8px 12px;
    border-radius: 8px;
    width: 300px;
    transition: .2s
}
.doc-title:hover { background: var(--surface-1) }
.doc-title:focus {
    background: var(--surface-1);
    border: 1px solid var(--md-sys-color-primary)
}
.actions {
    display: flex;
    gap: 8px;
    align-items: center
}
.btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 0;
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s
}
.btn-icon:hover {
    background: var(--surface-1);
    color: var(--text-main)
}
.btn-chip {
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 1px solid var(--outline);
    background: transparent;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Google Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: .2s;
    white-space: nowrap
}
.btn-chip:hover { background: var(--surface-1) }
.btn-chip.active {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    border-color: transparent
}
.btn-chip:disabled {
    opacity: .4;
    cursor: not-allowed;
    border-color: var(--outline-variant)
}
#viewport {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(var(--grid-color) 1px, transparent 1px);
    background-size: 24px 24px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    min-height: 0;
    touch-action: none
}
#viewport.drag-over {
    background-color: rgba(217,119,54,0.1);
    outline: 3px dashed var(--md-sys-color-primary);
    outline-offset: -3px
}
#paper {
    background: #fff;
    box-shadow: 0 4px 20px var(--shadow-color);
    position: relative;
    display: none;
    transform-origin: center center;
    transition: transform .05s linear
}
#previewImg {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none
}
#previewImg:not([src]),
#previewImg[src=""] { display: none }
.layer-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none
}
#cropLayer {
    cursor: crosshair;
    pointer-events: auto;
    display: none;
    touch-action: none
}
#stencilLayer {
    display: block;
    z-index: 10
}
#emptyState {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: var(--text-sub);
    pointer-events: none
}
#emptyState span {
    font-size: 64px;
    color: var(--outline)
}
#magnifier {
    position: fixed;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 3px solid var(--md-sys-color-primary);
    background: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    overflow: hidden;
    pointer-events: none;
    z-index: 9999;
    display: none
}
#magCanvas {
    width: 100%;
    height: 100%;
    display: block
}
#sidebar {
    width: 340px;
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border-radius: 16px;
    padding: 20px 16px;
    gap: 16px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--shadow-color);
    z-index: 10
}
.brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 4px;
    color: var(--text-main)
}
.brand-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0
}
.brand-icon {
    color: var(--md-sys-color-primary);
    font-size: 28px;
    flex-shrink: 0
}
.brand-text {
    display: flex;
    flex-direction: column;
    min-width: 0
}
.brand-name {
    font-family: "Google Sans", sans-serif;
    font-size: 20px;
    white-space: nowrap
}
.brand-pages {
    font-size: 11px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis
}
.sidebar-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 24px;
    border: 0;
    background: transparent;
    color: var(--text-sub);
    cursor: pointer
}
.sidebar-toggle:hover { background: rgba(0,0,0,.04) }
.fab-add {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 56px;
    border-radius: 16px;
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    font-family: "Google Sans", sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: .2s;
    overflow: hidden;
    flex-shrink: 0;
    font-size: 14px;
    border: 0
}
.fab-add:hover {
    filter: brightness(1.08);
    box-shadow: 0 4px 8px rgba(0,0,0,.2)
}
#sidebarBody {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .3s var(--ease-slide), transform .3s var(--ease-slide);
    will-change: opacity, transform
}
#pageList {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px
}
#pageList::-webkit-scrollbar { width: 4px }
#pageList::-webkit-scrollbar-thumb {
    background: var(--outline);
    border-radius: 4px
}
.page-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px;
    border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer;
    background: transparent;
    user-select: none;
    position: relative;
    will-change: transform;
    transition: transform .18s var(--ease-spring),
                background .18s ease,
                box-shadow .18s ease,
                border-color .18s ease
}
.page-card:hover { background: rgba(255,255,255,.05) }
.page-card.active {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container)
}
.page-card.active .page-meta {
    color: var(--md-sys-color-on-primary-container);
    opacity: .8
}
.page-card.active .btn-del {
    color: var(--md-sys-color-on-primary-container);
    opacity: .7
}
.sortable-ghost { opacity: 0 !important }
.sortable-drag {
    opacity: 1 !important;
    background: var(--surface-1) !important;
    box-shadow: 0 16px 32px rgba(0,0,0,.3) !important;
    transform: scale(1.05);
    cursor: grabbing !important;
    z-index: 9999 !important;
    border-color: transparent !important;
    transition: none !important
}
.sortable-chosen { z-index: 1 }
.thumb {
    width: 48px;
    height: 64px;
    border-radius: 6px;
    background: var(--surface-2);
    object-fit: cover;
    border: 1px solid var(--outline);
    flex-shrink: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center
}
.thumb-placeholder {
    width: 48px;
    height: 64px;
    border-radius: 6px;
    background: var(--surface-2);
    border: 1px solid var(--outline);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center
}
.thumb-placeholder span {
    font-size: 24px;
    color: var(--outline)
}
.info {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    pointer-events: none
}
.filename {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis
}
.page-meta {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px
}
.drag-handle {
    color: var(--outline);
    font-size: 20px;
    cursor: grab
}
.btn-del {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
    flex-shrink: 0
}
.btn-del:hover {
    background: rgba(255,0,0,.1);
    color: var(--md-sys-color-error)
}
.bottom-controls {
    padding-top: 16px;
    border-top: 1px solid var(--outline);
    flex-shrink: 0;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .3s var(--ease-slide), transform .3s var(--ease-slide);
    will-change: opacity, transform
}
.btn-main {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    border: 0;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    font-family: "Google Sans", sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: .2s
}
.btn-main:hover {
    filter: brightness(1.1);
    box-shadow: 0 4px 10px rgba(0,0,0,.2)
}
.btn-main:disabled {
    background: var(--surface-2);
    color: var(--outline);
    cursor: default;
    box-shadow: none;
    filter: none
}
#toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-main);
    color: var(--surface-3);
    padding: 12px 24px;
    border-radius: 32px;
    font-size: 14px;
    opacity: 0;
    transition: .3s cubic-bezier(.2,0,0,1);
    pointer-events: none;
    z-index: 100;
    white-space: nowrap
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0)
}
#btnAddMobile {
    position: fixed;
    right: 16px;
    bottom: 24px;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    border: 0;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 60;
    transition: transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring)
}
#btnAddMobile span { font-size: 28px }
#btnAddMobile:active {
    transform: scale(.94);
    box-shadow: 0 2px 8px rgba(0,0,0,.25)
}
#sourceModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 700;
    display: none;
    align-items: flex-end;

<script>
(()=>{ "use strict";

/* ╔══════════════════════════════════════════════════════════════════════════════╗

/* ═══════════════════════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);

// A4 dimensions and scaling
const A4_CM_W = 21;

const BASE_A4_H = 3508;

const A4_W = Math.ceil(A4_CM_W * PX_PER_CM);
const A4_H = Math.ceil(A4_CM_H * PX_PER_CM);
const SX = A4_W / BASE_A4_W;
const SY = A4_H / BASE_A4_H;
const RENDER_SCALE = CONFIG.RENDER_SCALE;

// Stencil configuration
const STENCIL_CFG = {
    w: 18 * PX_PER_CM,
    h: 27 * PX_PER_CM,
    x: 1.5 * PX_PER_CM,

    borderColor: "#ffde00",

};

const MARKER_TARGET = {

};

const lerp = (a, b, t) => ({

});

function getStencilSVGString() {

}

window.downloadStencil = async (type) => {
    const svg = getStencilSVGString();
    
    if (type === "svg") {
        const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "scanner_stencil.svg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        E.dd.classList.remove("show");
        return;
    }
    
    const img = new Image();
    const svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);
    
    img.onload = () => {
        const c = document.createElement("canvas");
        c.width = A4_W;
        c.height = A4_H;
        const x = c.getContext("2d");
        x.fillStyle = "#fff";
        x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        
        if (type === "png") {
            const a = document.createElement("a");
            a.download = "scanner_stencil.png";
            a.href = c.toDataURL("image/png");
            document.body.appendChild(a);
            a.click();
            a.remove();
        } else {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4"
            });
            const data = c.toDataURL("image/jpeg", 0.95);
            pdf.addImage(data, "JPEG", 0, 0, 210, 297);
            pdf.save("scanner_stencil.pdf");
        }
        E.dd.classList.remove("show");
    };
    
    img.src = url;
};


/* ═══════════════════════════════════════════════════════════════════════════════
   SECTION 5: ZOOM & PAN CONTROLS
   ═══════════════════════════════════════════════════════════════════════════════ */

const Z = { s: 1, min: 1, max: 3, ox: 0, oy: 0 };
let pDist = 0, pScale = 1, pX = 0, pY = 0, panning = 0;

const applyZ = () => {
    E.paper.style.transform = `translate(${Z.ox}px,${Z.oy}px) scale(${Z.s})`;
};

const resetZ = () => {
    Z.s = 1;
    Z.ox = 0;
    Z.oy = 0;
    applyZ();
};

const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

E.viewport.addEventListener("touchstart", e => {
    if (S.crop || S.i < 0) return;
    
    if (e.touches.length === 2) {
        e.preventDefault();
        pDist = dist(e.touches[0], e.touches[1]);
        pScale = Z.s;
        panning = 0;
    } else if (e.touches.length === 1 && Z.s > 1) {
        e.preventDefault();
        panning = 1;
        pX = e.touches[0].clientX - Z.ox;
        pY = e.touches[0].clientY - Z.oy;
    }
}, { passive: false });

E.viewport.addEventListener("touchmove", e => {
    if (S.crop || S.i < 0) return;
    
    if (e.touches.length === 2 && pDist > 0) {
        e.preventDefault();
        let ns = pScale * (dist(e.touches[0], e.touches[1]) / pDist);
        ns = Math.max(Z.min, Math.min(Z.max, ns));
        Z.s = ns;
        applyZ();
    } else if (e.touches.length === 1 && panning && Z.s > 1) {
        e.preventDefault();
        Z.ox = e.touches[0].clientX - pX;
        Z.oy = e.touches[0].clientY - pY;
        applyZ();
    }
}, { passive: false });

E.viewport.addEventListener("touchend", e => {
    if (e.touches.length < 2) pDist = 0;
    if (e.touches.length === 0) panning = 0;
    if (Z.s <= 1.01) resetZ();
});

E.viewport.addEventListener("touchcancel", () => {
    pDist = 0;
    panning = 0;
    if (Z.s <= 1.01) resetZ();
});

const ALG = {

    },

        white: { src: null, dst: CONFIG.CALIBRATION_TARGETS.white }
    },
    SC: CONFIG.STENCIL_COLORS
};

class MM {
    constructor() { this.m = []; }
    
    t(x) {
        if (x && x.delete) this.m.push(x);
        return x;
    }
    
    d() {
        this.m.forEach(x => {
            try { if (!x.isDeleted()) x.delete(); } catch(e) {}
        });
        this.m = [];
    }
}

const mat2C = mat => {
    const c = document.createElement("canvas");
    c.width = mat.cols;
    c.height = mat.rows;
    cv.imshow(c, mat);
    return c;
};

const orderQuad = pts => {
    if (!pts || pts.length !== 4) return pts;
    const s = pts.slice().sort((a, b) => a.y - b.y);
    const t = s.slice(0, 2).sort((a, b) => a.x - b.x);
    const bo = s.slice(2).sort((a, b) => a.x - b.x);
    return [t[0], t[1], bo[1], bo[0]];
};

   SECTION 16: IMAGE PREPROCESSING
   ═══════════════════════════════════════════════════════════════════════════════ */

function preprocess(cvs) {
    const m = new MM();
    try {
        const src = m.t(cv.imread(cvs));
        const lab = m.t(new cv.Mat());
        
        cv.cvtColor(src, lab, cv.COLOR_RGBA2RGB);
        cv.cvtColor(lab, lab, cv.COLOR_RGB2Lab);
        
        const planes = m.t(new cv.MatVector());
        cv.split(lab, planes);
        
        const clahe = m.t(new cv.CLAHE(2, new cv.Size(8, 8)));
        clahe.apply(planes.get(0), planes.get(0));
        
        cv.merge(planes, lab);
        
        const res = m.t(new cv.Mat());
        cv.cvtColor(lab, res, cv.COLOR_Lab2RGB);
        
        return mat2C(res);
    } catch (e) {
        return null;
    } finally {
        m.d();
    }
}
